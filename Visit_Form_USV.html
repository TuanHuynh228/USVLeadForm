<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Visit Our Hung Yen Campus</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
    :root {
        --bg: #f5f1ea;
        --navy: #1a1f3a;
        --red: #c84540;
        --text: #1a1f3a;
        --muted: #9a9a9a;
        --line: #d4d0c8;
        --line-dark: #2a2f4a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
        font-family: 'Inter', sans-serif;
        background: var(--bg);
        color: var(--text);
        min-height: 100vh;
        padding: 60px 20px;
        font-size: 15px;
        line-height: 1.5;
    }

    .container {
        max-width: 820px;
        margin: 0 auto;
    }

    h1 {
        font-family: 'Cormorant Garamond', serif;
        font-size: 38px;
        font-weight: 500;
        text-align: center;
        color: var(--navy);
        letter-spacing: 2px;
        margin-bottom: 24px;
    }

    .subtitle {
        text-align: center;
        color: var(--navy);
        font-size: 15px;
        margin-bottom: 56px;
    }

    .section-label {
        color: var(--red);
        font-weight: 500;
        font-size: 15px;
        margin-bottom: 24px;
    }

    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 50px;
        margin-bottom: 32px;
    }

    .form-row.single {
        grid-template-columns: 1fr;
    }

    .form-group label {
        display: block;
        font-weight: 600;
        font-size: 15px;
        color: var(--navy);
        margin-bottom: 10px;
    }

    .required {
        color: var(--navy);
    }

    .form-group input[type="text"],
    .form-group input[type="email"],
    .form-group input[type="tel"],
    .form-group input[type="date"],
    .form-group select {
        width: 100%;
        border: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        padding: 8px 0;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        color: var(--text);
        outline: none;
        transition: border-color 0.2s;
    }

    .form-group input::placeholder {
        color: var(--muted);
        font-weight: 300;
    }

    .form-group input:focus,
    .form-group select:focus {
        border-bottom-color: var(--navy);
    }

    .form-group select {
        cursor: pointer;
        appearance: none;
        -webkit-appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%231a1f3a%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-position: right 10px top 50%;
        background-size: 10px auto;
    }
    .form-group select:invalid { color: var(--muted); }

    .divider {
        border-bottom: 1px solid var(--line);
        margin: 20px 0;
    }

    /* Collapsible */
    .collapsible {
        margin: 40px 0;
        border-bottom: 1px solid var(--line);
        padding-bottom: 30px;
    }

    .collapsible-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        cursor: pointer;
        padding: 8px 0;
        font-weight: 600;
        color: var(--navy);
        font-size: 15px;
        user-select: none;
    }

    .collapsible-header .chevron {
        color: var(--red);
        font-size: 12px;
        transition: transform 0.3s;
    }

    .collapsible.collapsed .chevron {
        transform: rotate(180deg);
    }

    .collapsible-body {
        margin-top: 20px;
        display: flex;
        flex-direction: column;
        gap: 18px;
    }

    .collapsible.collapsed .collapsible-body {
        display: none;
    }

    /* Custom checkboxes */
    .check-row {
        display: flex;
        align-items: center;
        gap: 14px;
        cursor: pointer;
        color: var(--navy);
        font-size: 15px;
    }

    .check-row input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 18px;
        height: 18px;
        border: 1.5px solid var(--navy);
        background: transparent;
        cursor: pointer;
        position: relative;
        flex-shrink: 0;
        border-radius: 1px;
    }

    .check-row input[type="checkbox"]:checked {
        background: transparent;
    }

    .check-row input[type="checkbox"]:checked::after {
        content: "";
        position: absolute;
        left: 4px;
        top: 0px;
        width: 6px;
        height: 11px;
        border: solid var(--navy);
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    /* Inline check group (Morning/Afternoon, 1-2-3-4, Yes/No) */
    .inline-checks {
        display: flex;
        align-items: center;
        gap: 28px;
        padding-top: 6px;
    }

    .alert-text {
        color: var(--red);
        font-weight: 500;
        font-size: 15px;
        margin: 40px 0 24px 0;
    }

    /* Add another child button */
    .add-btn {
        width: 100%;
        background: transparent;
        border: 1.5px solid var(--navy);
        padding: 18px;
        font-family: 'Inter', sans-serif;
        font-size: 15px;
        font-weight: 500;
        color: var(--navy);
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        margin: 30px 0;
        transition: background 0.2s;
    }

    .add-btn:hover {
        background: rgba(26, 31, 58, 0.05);
    }

    .add-btn .plus {
        font-size: 18px;
        font-weight: 400;
    }

    /* Submit */
    .submit-wrapper {
        display: flex;
        justify-content: center;
        margin-top: 40px;
    }

    .submit-btn {
        background: var(--red);
        color: white;
        border: none;
        padding: 16px 90px;
        font-family: 'Inter', sans-serif;
        font-size: 16px;
        font-weight: 500;
        cursor: pointer;
        letter-spacing: 0.5px;
        transition: background 0.2s;
    }

    .submit-btn:hover {
        background: #b03a35;
    }

    /* Date input styling */
    input[type="date"]::-webkit-calendar-picker-indicator {
        opacity: 0.4;
        cursor: pointer;
    }

    .child-block {
        margin-top: 24px;
    }

    .child-block .remove-link {
        display: inline-block;
        margin-top: 8px;
        font-size: 13px;
        color: var(--red);
        cursor: pointer;
        text-decoration: underline;
    }

    /* Nationality search dropdown */
    .nationality-wrapper {
        position: relative;
    }

    .nationality-wrapper::after {
        content: '';
        position: absolute;
        right: 10px;
        top: 50%;
        transform: translateY(-50%);
        width: 10px;
        height: 10px;
        background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%231a1f3a%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.4-12.8z%22%2F%3E%3C%2Fsvg%3E");
        background-repeat: no-repeat;
        background-size: contain;
        pointer-events: none;
        transition: transform 0.25s;
    }

    .nationality-wrapper.open::after {
        transform: translateY(-50%) rotate(180deg);
    }

    #nationalitySearch {
        cursor: pointer;
        padding-right: 28px;
    }

    .nationality-dropdown {
        position: absolute;
        top: calc(100% + 2px);
        left: 0;
        right: 0;
        background: #fff;
        border: 1px solid var(--line);
        max-height: 220px;
        overflow-y: auto;
        z-index: 200;
        display: none;
        list-style: none;
        box-shadow: 0 4px 16px rgba(0,0,0,0.08);
    }

    .nationality-dropdown.open {
        display: block;
    }

    .nationality-dropdown li {
        padding: 10px 14px;
        cursor: pointer;
        font-size: 15px;
        color: var(--text);
        transition: background 0.15s;
    }

    .nationality-dropdown li:hover {
        background: rgba(26, 31, 58, 0.06);
    }

    .nationality-dropdown li.no-results {
        color: var(--muted);
        cursor: default;
        font-weight: 300;
    }

    #nationalitySearch.error {
        border-bottom-color: var(--red);
    }

    @media (max-width: 640px) {
        body { padding: 30px 16px; }
        h1 { font-size: 26px; letter-spacing: 1px; }
        .form-row { grid-template-columns: 1fr; gap: 24px; }
        .submit-btn { padding: 14px 60px; }
        .inline-checks { flex-wrap: wrap; gap: 16px; }
    }
</style>
</head>
<body>
<div class="container">
    <h1>VISIT OUR HUNG YEN CAMPUS</h1>
    <p class="subtitle">Please fill in the form below to request a place on one of the Uppingham Visiting Days.</p>

    <form action="https://webto.salesforce.com/servlet/servlet.WebToLead?encoding=UTF-8&orgId=00Dd500000CnbvZ" method="POST" id="visitForm">
        <input type="hidden" name="oid" value="00Dd500000CnbvZ">
        <input type="hidden" name="retURL" value="https://uppingham.edu.vn">
        
        <input type="hidden" id="Children_JSON__c" name="00NRB00001hAHMT">

        <div class="section-label">Parent details</div>

        <div class="form-row">
            <div class="form-group">
                <label>First name <span class="required">*</span></label>
                <input type="text" name="first_name" placeholder="Parent first name" required>
            </div>
            <div class="form-group">
                <label>Last name <span class="required">*</span></label>
                <input type="text" name="last_name" placeholder="Parent last name" required>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Email address <span class="required">*</span></label>
                <input type="email" name="email" placeholder="Parent email address" required>
            </div>
            <div class="form-group">
                <label>Contact number <span class="required">*</span></label>
                <input type="tel" name="mobile" placeholder="Parent contact number" required>
            </div>
        </div>

        <div class="form-row single">
            <div class="form-group">
                <label>Nationality <span class="required">*</span></label>
                <div class="nationality-wrapper" id="nationalityWrapper">
                    <input type="text" id="nationalitySearch" placeholder="Select Parent nationality" autocomplete="off" readonly>
                    <input type="hidden" name="00NRB00001hAnuD" id="nationalityValue">
                    <ul class="nationality-dropdown" id="nationalityDropdown"></ul>
                </div>
            </div>
        </div>

        <div class="collapsible" id="hearAbout">
            <div class="collapsible-header" onclick="toggleCollapse('hearAbout')">
                <span>How did you hear about us</span>
                <span class="chevron">&#9650;</span>
            </div>
            <div class="collapsible-body">
                <label class="check-row"><input type="checkbox" name="lead_source" value="Search Engine"> Search Engine (Google, Bing, etc.)</label>
                <label class="check-row"><input type="checkbox" name="lead_source" value="Social Media"> Social Media (Search or banner ad)</label>
                <label class="check-row"><input type="checkbox" name="lead_source" value="Billboard"> Billboard</label>
                <label class="check-row"><input type="checkbox" name="lead_source" value="Referral"> Referral (Word-of-mouth or from another school)</label>
                <label class="check-row"><input type="checkbox" name="lead_source" value="Events"> Events</label>
                <label class="check-row"><input type="checkbox" name="lead_source" value="Other"> Other</label>
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label>Preferred visit date <span class="required">*</span></label>
                <input type="date" name="00NRB00001gCdPt" required>
            </div>
            <div class="form-group">
                <label>Preferred time <span class="required">*</span></label>
                <div class="inline-checks">
                    <label class="check-row"><input type="checkbox" name="00NRB00001hBCe5" value="Morning"> Morning</label>
                    <label class="check-row"><input type="checkbox" name="00NRB00001hBCe5" value="Afternoon"> Afternoon</label>
                </div>
            </div>
        </div>

        <div class="alert-text">Please confirm how many people will be attending the Visiting Day.</div>

        <div class="form-row">
            <div class="form-group">
                <label>Number of attendees <span class="required">*</span></label>
                <div class="inline-checks">
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMU" value="1"> 1</label>
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMU" value="2"> 2</label>
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMU" value="3"> 3</label>
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMU" value="4"> 4</label>
                </div>
            </div>
            <div class="form-group">
                <label>Will your child attend the visit? <span class="required">*</span></label>
                <div class="inline-checks">
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMV" value="Yes" checked> Yes</label>
                    <label class="check-row"><input type="checkbox" name="00NRB00001hAHMV" value="No"> No</label>
                </div>
            </div>
        </div>

        <div id="childrenContainer">
            <div class="child-block">
                <div class="form-group">
                    <label>Child 1 — Date of Birth <span class="required">*</span></label>
                    <input type="date" name="child1Dob" required>
                </div>
            </div>
        </div>

        <button type="button" class="add-btn" onclick="addChild()">
            <span class="plus">+</span> Add another child
        </button>

        <div class="submit-wrapper">
            <button type="submit" class="submit-btn">Submit</button>
        </div>
    </form>
</div>

<script>
    const NATIONALITIES = [
        { value: 'USA', label: 'American' },
        { value: 'AUS', label: 'Australian' },
        { value: 'BRA', label: 'Brazilian' },
        { value: 'GBR', label: 'British' },
        { value: 'KHM', label: 'Cambodian' },
        { value: 'CAN', label: 'Canadian' },
        { value: 'CHN', label: 'Chinese' },
        { value: 'PHL', label: 'Filipino' },
        { value: 'FRA', label: 'French' },
        { value: 'DEU', label: 'German' },
        { value: 'IND', label: 'Indian' },
        { value: 'IDN', label: 'Indonesian' },
        { value: 'ITA', label: 'Italian' },
        { value: 'JPN', label: 'Japanese' },
        { value: 'LAO', label: 'Laotian' },
        { value: 'MYS', label: 'Malaysian' },
        { value: 'MEX', label: 'Mexican' },
        { value: 'RUS', label: 'Russian' },
        { value: 'SGP', label: 'Singaporean' },
        { value: 'ZAF', label: 'South African' },
        { value: 'KOR', label: 'South Korean' },
        { value: 'ESP', label: 'Spanish' },
        { value: 'THA', label: 'Thai' },
        { value: 'VNM', label: 'Vietnamese' },
    ];

    (function setupNationalitySearch() {
        const wrapper  = document.getElementById('nationalityWrapper');
        const search   = document.getElementById('nationalitySearch');
        const hidden   = document.getElementById('nationalityValue');
        const dropdown = document.getElementById('nationalityDropdown');

        function renderOptions(list) {
            if (list.length === 0) {
                dropdown.innerHTML = '<li class="no-results">No results found</li>';
                return;
            }
            dropdown.innerHTML = list
                .map(n => `<li data-value="${n.value}">${n.label}</li>`)
                .join('');
            dropdown.querySelectorAll('li').forEach(li => {
                li.addEventListener('mousedown', function(e) {
                    e.preventDefault();
                    selectOption(this.dataset.value, this.textContent);
                });
            });
        }

        function openDropdown() {
            renderOptions(NATIONALITIES);
            dropdown.classList.add('open');
            wrapper.classList.add('open');
        }

        function closeDropdown() {
            dropdown.classList.remove('open');
            wrapper.classList.remove('open');
            search.readOnly = true;
            if (hidden.value) {
                const found = NATIONALITIES.find(n => n.value === hidden.value);
                search.value = found ? found.label : '';
            } else {
                search.value = '';
            }
        }

        function selectOption(value, label) {
            hidden.value = value;
            search.value = label;
            search.classList.remove('error');
            closeDropdown();
        }

        search.addEventListener('click', function() {
            if (dropdown.classList.contains('open')) {
                closeDropdown();
                return;
            }
            this.readOnly = false;
            this.value = '';
            openDropdown();
        });

        search.addEventListener('input', function() {
            const q = this.value.trim().toLowerCase();
            const filtered = q
                ? NATIONALITIES.filter(n => n.label.toLowerCase().includes(q))
                : NATIONALITIES;
            renderOptions(filtered);
            if (!dropdown.classList.contains('open')) {
                dropdown.classList.add('open');
                wrapper.classList.add('open');
            }
        });

        search.addEventListener('blur', function() {
            setTimeout(closeDropdown, 160);
        });
    })();

    function toggleCollapse(id) {
        document.getElementById(id).classList.toggle('collapsed');
    }

    const MAX_CHILDREN = 4;

    function addChild() {
        const container = document.getElementById('childrenContainer');
        const currentCount = container.querySelectorAll('.child-block').length;

        if (currentCount >= MAX_CHILDREN) {
            alert(`You can add up to ${MAX_CHILDREN} children only.`);
            return;
        }

        const newIndex = currentCount + 1;
        const block = document.createElement('div');
        block.className = 'child-block';
        block.innerHTML = `
            <div class="form-group">
                <label>Child ${newIndex} — Date of Birth <span class="required">*</span></label>
                <input type="date" name="child${newIndex}Dob" required>
                <span class="remove-link" onclick="removeChildBlock(this)">Remove</span>
            </div>
        `;
        container.appendChild(block);
    }

    function removeChildBlock(el) {
        el.closest('.child-block').remove();
        renumberChildren();
    }

    function renumberChildren() {
        const blocks = document.querySelectorAll('#childrenContainer .child-block');
        blocks.forEach((block, idx) => {
            const number = idx + 1;
            const label = block.querySelector('label');
            const input = block.querySelector('input[type="date"]');
            const removeLink = block.querySelector('.remove-link');

            label.innerHTML = `Child ${number} — Date of Birth <span class="required">*</span>`;
            input.name = `child${number}Dob`;

            // Child 1 không có nút Remove, các child khác thì có
            if (number === 1) {
                if (removeLink) removeLink.remove();
            } else {
                if (!removeLink) {
                    const link = document.createElement('span');
                    link.className = 'remove-link';
                    link.textContent = 'Remove';
                    link.onclick = function() { removeChildBlock(this); };
                    block.querySelector('.form-group').appendChild(link);
                }
            }
        });
    }

    // Make attendee & time & yes/no behave as single-select using checkboxes
    function setupSingleSelect(name) {
        document.querySelectorAll(`input[name="${name}"]`).forEach(cb => {
            cb.addEventListener('change', function() {
                if (this.checked) {
                    document.querySelectorAll(`input[name="${name}"]`).forEach(other => {
                        if (other !== this) other.checked = false;
                    });
                }
            });
        });
    }

    // Cập nhật tham số Javascript khớp với ID Custom fields của Org
    setupSingleSelect('00NRB00001hBCe5'); // Preferred time
    setupSingleSelect('00NRB00001hAHMU'); // Number of attendees
    setupSingleSelect('00NRB00001hAHMV'); // Will child attend

    document.getElementById('visitForm').addEventListener('submit', function(e) {
        const natSearch = document.getElementById('nationalitySearch');
        const natValue  = document.getElementById('nationalityValue');
        
        // Bắt lỗi nếu chưa chọn Nationality
        if (!natValue.value) {
            e.preventDefault(); 
            natSearch.classList.add('error');
            natSearch.focus();
            return;
        }

        let childrenData = [];
        
        let childInputs = document.querySelectorAll('#childrenContainer input[type="date"]');
        
        childInputs.forEach(function(input) {
            if (input.value) {
                childrenData.push({ dob: input.value });
            }
        });
        
        // Nhúng dữ liệu JSON vào ID của trường Children_JSON__c
        document.getElementById('Children_JSON__c').value = JSON.stringify(childrenData);
    });
</script>
</body>
</html>
